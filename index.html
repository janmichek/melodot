<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <meta name="theme-color" content="#0c0b09" />
    <meta name="color-scheme" content="dark" />

    <title>Donalyze — Hear it. Tip it. On-chain.</title>
    <meta
      name="description"
      content="Record a song, identify it instantly, and tip the artist directly on Polkadot. Donalyze turns a moment of gratitude into an on-chain payment without intermediaries."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="author" content="Donalyze" />
    <link rel="canonical" href="https://donalyze.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="llms" href="/llms.txt" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Donalyze" />
    <meta property="og:title" content="Donalyze — Hear it. Tip it. On-chain." />
    <meta
      property="og:description"
      content="Music discovery and direct artist tipping on Polkadot. Hear a song, tip the artist, no middlemen."
    />
    <meta property="og:url" content="https://donalyze.vercel.app/" />
    <meta property="og:image" content="https://donalyze.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Donalyze — Hear it. Tip it. On-chain." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Donalyze — Hear it. Tip it. On-chain." />
    <meta
      name="twitter:description"
      content="Music discovery and direct artist tipping on Polkadot. Hear a song, tip the artist, no middlemen."
    />
    <meta name="twitter:image" content="https://donalyze.vercel.app/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Donalyze",
            "url": "https://donalyze.vercel.app/",
            "description": "Audio-first music discovery and direct artist tipping on Polkadot Hub TestNet.",
            "applicationCategory": "MusicApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript and Web Audio API",
            "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
            "creator": {
              "@type": "Organization",
              "name": "Donalyze",
              "url": "https://github.com/janmichek/melodot"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How does Donalyze identify a song?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Donalyze records a short audio sample and sends it to an audio-recognition API, then resolves the matching Spotify artists."
                }
              },
              {
                "@type": "Question",
                "name": "How do artists receive tips?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Tips accrue in the Donate contract on Polkadot Hub TestNet. Verified artists claim their artist ID with an EIP-712 authorisation, settle the balance, and withdraw PAS."
                }
              },
              {
                "@type": "Question",
                "name": "Are donations reversible?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Donations are on-chain transactions and are irreversible once confirmed."
                }
              }
            ]
          }
        ]
      }
    </script>

    <script type="module">
      import {Buffer} from "buffer";
      import process from "process";

      window.Buffer = Buffer;
      window.process = process;
    </script>
  </head>
  <body>
    <noscript>
      <main style="max-width: 42rem; margin: 12vh auto; font-family: system-ui; padding: 1.5rem">
        <h1>Donalyze needs JavaScript</h1>
        <p>
          Donalyze records audio and talks to Polkadot from your browser. Enable JavaScript to
          discover a track and tip the artist.
        </p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
